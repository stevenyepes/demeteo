[package]
name = "demeteo-runner"
version.workspace = true
description = "Headless runner: executes a Demeteo workflow to completion on a Linux box with no desktop app attached"
authors = ["Steven Yepes <contact@stvcloud.dev>"]
license = "MIT"
edition = "2021"

[[bin]]
name = "demeteo-runner"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
demeteo-core = { path = "../demeteo-core", default-features = false, features = ["vendored-openssl"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[lints]
workspace = true
