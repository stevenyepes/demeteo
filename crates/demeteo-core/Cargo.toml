[package]
name = "demeteo-core"
version.workspace = true
description = "Tauri-free engine: domain, ports, application, and adapters shared by the desktop app and the headless runner"
authors = ["Steven Yepes <contact@stvcloud.dev>"]
license = "MIT"
edition = "2021"

[features]
# OS-keyring-backed credential cache for the desktop app. Off in
# `demeteo-runner`: the runner is intentionally in-memory only per
# crates/demeteo-runner/src/credentials.rs. There is also no keyring
# daemon to talk to on a headless remote, so linking one in would only
# buy a store that always fails to open.
default = ["keyring"]
keyring = ["dep:keyring"]
# Build openssl from source via openssl-sys's vendored feature instead
# of letting pkg-config locate the host's libssl. Required when
# cross-compiling to x86_64-unknown-linux-musl: the host's libssl-dev
# is glibc-linked and won't link into a static musl binary, and
# pkg-config cannot find a musl-compatible OpenSSL on a gnu host.
# Enabled in this crate for the headless runner only; the desktop
# Tauri app builds on linux-gnu/macOS/Windows where system openssl
# is fine and skipping the vendored build saves several minutes.
vendored-openssl = ["ssh2/vendored-openssl"]
# Opt-in for the C2.2 SSH leg of the `exec_contract` conformance suite
# (docs/EXECUTION_CONSISTENCY_PLAN.md). Off by default so a Docker-less
# `cargo test` still passes; the CI job (and
# tests/conformance/run-ssh-conformance.sh) stands up a loopback sshd,
# exports DEMETEO_SSH_CONFORMANCE_*, and runs the same assertions the
# local adapter passes — the only way to prove local/SSH parity.
ssh-conformance = []

[dependencies]
async-trait = "0.1"
keyring = { version = "4", optional = true }
parking_lot = "0.12"
refinery = { version = "0.9", features = ["rusqlite"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
rusqlite = { version = "0.39", features = ["bundled"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = "0.6"
ssh2 = "0.9"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tracing = "0.1"
schemars = "1"
jsonschema = { version = "0.49", default-features = false }

# Unix-only: `setsid(2)` in `shared::proc::detach_from_controlling_tty`, so
# locally-spawned interactive shells don't seize the controlling terminal.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Registry", "Win32_System_Threading"] }

[lints]
workspace = true
