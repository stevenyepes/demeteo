[package]
name = "demeteo"
version.workspace = true
description = "Desktop control plane for orchestrating local and remote AI coding agents"
authors = ["Steven Yepes <contact@stvcloud.dev>"]
license = "MIT"
repository = "https://github.com/stevenyepes/demeteo"
homepage = "https://github.com/stevenyepes/demeteo"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type = ["cdylib", "rlib", "staticlib"]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "demeteo_lib"

[dependencies]
demeteo-core = { path = "../crates/demeteo-core" }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# Cryptographically-strong bytes for the per-session activity nonce
# (TERMINAL_ACTIVITY_PLAN §2 — a spoofed OSC becomes notification spam once
# Phase 2 fires OS notifications, so the nonce must be unguessable). Small,
# no_std-friendly, and already present transitively in the lock.
getrandom = "0.3"
keyring = "4"
portable-pty = "0.9"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
rusqlite = { version = "0.39", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ssh2 = "0.9"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2.7.1"
tauri-plugin-notification = "2.3.3"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
async-trait = "0.1"
# `test` enables Tauri's headless MockRuntime so the tray runtime helpers
# (`run_in_background_enabled`, `cleanup_terminal_sessions`) can be exercised
# against a real `AppHandle` without a display server.
tauri = { version = "2", features = ["test"] }
