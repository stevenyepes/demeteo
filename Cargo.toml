[workspace]
resolver = "2"
members = ["src-tauri", "crates/demeteo-core", "crates/demeteo-runner"]

# Single source of truth for the version every crate reports. All three
# members inherit this via `version.workspace = true`, so `CARGO_PKG_VERSION`
# — and therefore `demeteo-runner --version`'s fallback — is always the real
# product version, not a per-crate value that drifts. `promote.yml` bumps
# only this line at release time. (Nightly `<base>-N` builds, which never
# mutate Cargo.toml, still override the runner via `DEMETEO_RUNNER_VERSION`.)
[workspace.package]
version = "1.0.0"

# Doc links are the one part of a comment a machine can check. A `[`Foo`]`
# that no longer resolves means the item was renamed or moved and the prose
# around it was not revisited — exactly the rot `scripts/check-doc-refs.sh`
# catches for file paths. Denied, not warned, so it fails the gate rather
# than scrolling past in a build log. Surfaces under `cargo doc`, which
# `scripts/checks.sh` runs; `cargo clippy` does not evaluate rustdoc lints.
[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
