name: PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [master]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libdbus-1-dev \
            pkg-config

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: TypeScript type-check
        run: npx tsc --noEmit

      - name: Rust format check
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Rust clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust tests (build)
        working-directory: src-tauri
        run: cargo test --no-run

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Gate feedback repro test
        env:
          DEMETEO_REPO_PATH: ${{ github.workspace }}
        run: node tests/repro/gate-feedback-rerender.mjs

      - name: Lint commits
        uses: wagoid/commitlint-github-action@v6
        with:
          configFile: .commitlintrc.json
          failOnWarnings: false

  # C2.2 — proves local/SSH parity by running the byte-identical
  # `exec_contract` against `SshClientAdapter` pointed at a throwaway
  # loopback sshd. Separate job: it needs Docker but none of the Tauri/
  # webkit toolchain the `verify` job installs.
  # (docs/EXECUTION_CONSISTENCY_PLAN.md)
  ssh-conformance:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Run ExecutionPort SSH conformance suite
        run: crates/demeteo-core/tests/conformance/run-ssh-conformance.sh

  # C5 — topology-equivalence gate: one workflow run through local and
  # desktop-over-SSH must render an equivalent RunView (the runner leg lives in
  # the separate runner-conformance job because it additionally needs an
  # in-container git host). Uses the deterministic `stub` agent so a run
  # reaches a terminal state with no real LLM CLI. Separate job for the same
  # reason as ssh-conformance: it needs Docker, not the Tauri toolchain.
  # (docs/EXECUTION_CONSISTENCY_PLAN.md)
  topology-conformance:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Run topology equivalence suite (local + SSH)
        run: crates/demeteo-core/tests/conformance/run-topology-conformance.sh