name: PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [master]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libdbus-1-dev \
            pkg-config

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      # The build/test gate is a single shared script (scripts/checks.sh) that
      # developers and agents run locally before pushing, so "green locally"
      # means "green in CI" — no drift between an ad-hoc local run and this
      # job. It runs tsc, Biome, the Vitest frontend suite, fmt --check, clippy
      # -D warnings (on the pinned toolchain, rust-toolchain.toml), and the
      # demeteo + core + runner tests. Commitlint is skipped here because the
      # dedicated `wagoid` step below is the canonical PR-range gate.
      - name: PR checks (tsc, biome, vitest, fmt, clippy, tests)
        env:
          CHECKS_SKIP_COMMITLINT: "1"
        run: ./scripts/checks.sh

      - name: Lint commits
        uses: wagoid/commitlint-github-action@v6
        with:
          configFile: .commitlintrc.json
          failOnWarnings: false

  # C2.2 — proves local/SSH parity by running the byte-identical
  # `exec_contract` against `SshClientAdapter` pointed at a throwaway
  # loopback sshd. Separate job: it needs Docker but none of the Tauri/
  # webkit toolchain the `verify` job installs.
  # (docs/EXECUTION_PARITY.md)
  ssh-conformance:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Run ExecutionPort SSH conformance suite
        run: crates/demeteo-core/tests/conformance/run-ssh-conformance.sh

  # C5 — topology-equivalence gate: one workflow run through local and
  # desktop-over-SSH must render an equivalent RunView (the runner leg lives in
  # the separate runner-conformance job because it additionally needs an
  # in-container git host). Uses the deterministic `stub` agent so a run
  # reaches a terminal state with no real LLM CLI. Separate job for the same
  # reason as ssh-conformance: it needs Docker, not the Tauri toolchain.
  # (docs/EXECUTION_PARITY.md)
  topology-conformance:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Run topology equivalence suite (local + SSH)
        run: crates/demeteo-core/tests/conformance/run-topology-conformance.sh