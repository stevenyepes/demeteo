name: PR Checks

# Also runs on master pushes, for two reasons neither of which is "test master
# twice". (1) A squash merge lands a commit no PR run ever saw — build.yml only
# bundles it, so a merge onto a moved master could ship broken and stay that way
# until the next PR opened. (2) Actions cache scoping: a PR run can read only
# its own ref's caches and the base branch's, never a sibling PR's. The Rust
# caches below are saved on master only, so every PR starts warm from the last
# master run instead of cold in every job (~5 min per PR run, and ~3.6 GB of
# cache per PR that used to push the repo into eviction at the 10 GB cap).
on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [master]

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  # The build/test gate is a single shared script (scripts/checks.sh) that
  # developers and agents run locally before pushing, so "green locally" means
  # "green in CI" — no drift between an ad-hoc local run and these jobs. It is
  # split here by toolchain, not by gate: `frontend` needs no Rust and no
  # webkit packages, so a type error is reported in ~2 minutes rather than at
  # the end of a 14-minute step; `rust` carries fmt, clippy -D warnings (on the
  # pinned toolchain, rust-toolchain.toml), cargo doc, doc-refs and the demeteo
  # + core + runner tests. Commitlint lives in lint-commits.yml.
  frontend:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend checks (tsc, biome, class names, vitest)
        run: ./scripts/checks.sh frontend

  rust:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libdbus-1-dev \
            pkg-config

      # Installing `@stable` and letting rust-toolchain.toml override it at the
      # first cargo call downloads two toolchains. Reading the channel out of the
      # file installs exactly the one that will run, and keeps the bump in one
      # place (§7: local clippy must be CI clippy).
      - name: Resolve pinned toolchain
        id: toolchain
        shell: bash
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: clippy, rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> src-tauri/target"
          save-if: ${{ github.ref == 'refs/heads/master' }}
          cache-on-failure: true

      - name: Rust checks (fmt, clippy, doc, doc-refs, tests)
        run: ./scripts/checks.sh rust

  # The other two targets the desktop app ships on (build.yml's matrix). The
  # `rust` job runs on ubuntu only, so every `#[cfg(windows)]` item — and the
  # whole macOS half of every `cfg` — is unreachable from it, and the breakage
  # surfaces on master or a tag instead of on the PR. Compile coverage is the
  # point: clippy `--all-targets` type-checks the test targets too, so a
  # Windows-only test module that no ubuntu job can build fails here.
  # (AGENTS.md §3 "Cross-OS", docs/WINDOWS_PARITY.md "Gates")
  #
  # macos-14 is pinned to the image build.yml releases from, so a PR compiles
  # on the same SDK the shipped .app is built with.
  cross-os:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-14]

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Resolve pinned toolchain
        id: toolchain
        shell: bash
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> src-tauri/target"
          save-if: ${{ github.ref == 'refs/heads/master' }}
          cache-on-failure: true

      - name: Install frontend dependencies
        run: npm ci

      - name: TypeScript type-check (tsc --noEmit)
        run: npx tsc --noEmit

      # demeteo-runner is excluded deliberately: it is remote-side code and the
      # remote is always Linux, and selecting it would unify its
      # `vendored-openssl` feature into demeteo-core, building OpenSSL from
      # source on both runners for a binary neither one ever produces.
      - name: Rust clippy (--all-targets -D warnings)
        run: cargo clippy --workspace --exclude demeteo-runner --all-targets -- -D warnings

      - name: Core + hub-protocol tests
        run: cargo test -p demeteo-core -p demeteo-hub-protocol

  # The two parity gates, in one job because they share everything expensive:
  # the same loopback sshd image (each script builds it; the second build is a
  # layer-cache hit) and the same demeteo-core test build with the
  # `ssh-conformance` feature. As two jobs they compiled that build twice into
  # two ~470 MB caches. Separate from `rust` because they need Docker but none
  # of the Tauri/webkit toolchain.
  #
  # C2.2 — proves local/SSH parity by running the byte-identical `exec_contract`
  # against `SshClientAdapter` pointed at a throwaway loopback sshd.
  # C5 — topology-equivalence gate: one workflow run through local and
  # desktop-over-SSH must render an equivalent RunView (the runner leg lives in
  # the separate runner-conformance script because it additionally needs an
  # in-container git host). Uses the deterministic `stub` agent so a run reaches
  # a terminal state with no real LLM CLI. (docs/EXECUTION_PARITY.md)
  conformance:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Resolve pinned toolchain
        id: toolchain
        shell: bash
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> src-tauri/target"
          save-if: ${{ github.ref == 'refs/heads/master' }}
          cache-on-failure: true

      - name: Run ExecutionPort SSH conformance suite
        run: crates/demeteo-core/tests/conformance/run-ssh-conformance.sh

      - name: Run topology equivalence suite (local + SSH)
        run: crates/demeteo-core/tests/conformance/run-topology-conformance.sh

  # The Hub against the services it is deployed with. `scripts/checks.sh` runs
  # `cargo test -p demeteo-hub`, but the tenancy and OpenBao round-trip tests
  # are `#[ignore]`d there because they need a live Postgres and an unsealed
  # OpenBao; this job is the only place they run. Separate from `rust` because
  # it needs Docker, and checks.sh has to stay runnable without it.
  #
  # Compose rather than `services:` containers, for two reasons. A service
  # container starts before checkout, so `deploy/hub/openbao/config.hcl` cannot
  # be mounted into it, and `services:` has no key for the `server` command the
  # image needs. And the point is to bring the stack up the way an operator
  # does: the real compose.yaml, then deploy/hub/README.md's init, unseal,
  # Transit, policy and token steps in the README's order — so a README that
  # stops working fails here rather than on someone's host.
  #
  # The image is built to prove the Dockerfile's COPY allow-list still covers
  # the workspace, then discarded with the runner. Nothing here can publish
  # it: no registry login, and the workflow's token is `contents: read`. No
  # layer cache either — a cold release build is cheaper than another entry
  # against the 10 GB cap the header describes.
  hub:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    defaults:
      run:
        # Explicitly `bash`, which Actions runs with `-o pipefail`; the default
        # shell omits it, and a failed `bao … | jq` would then read as success.
        shell: bash
    env:
      # A throwaway for a database that lives one job; compose refuses every
      # command without it. Must stay URL-safe (deploy/hub/README.md).
      POSTGRES_PASSWORD: hub-ci-throwaway
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve pinned toolchain
        id: toolchain
        shell: bash
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> src-tauri/target"
          save-if: ${{ github.ref == 'refs/heads/master' }}
          cache-on-failure: true

      - name: Start Postgres and OpenBao
        working-directory: deploy/hub
        run: docker compose -f compose.yaml -f compose.test.yaml up -d --wait postgres openbao

      # Parsing the unseal keys and root token in a script is acceptable only
      # because this OpenBao and everything it wraps are gone when the job
      # ends. The README's "First run" section is the rule for a real one.
      - name: Initialise and unseal OpenBao, enable Transit, mint the Hub token
        working-directory: deploy/hub
        run: |
          # Bare `-e BAO_TOKEN` forwards the caller's value, so the root token
          # never sits on a command line. Stdin stays attached for the policy
          # heredoc — which is why nothing below pipes into a `while read`:
          # the first `bao` in the loop body would swallow the rest of the pipe.
          bao() {
            docker compose exec -T -e BAO_ADDR=http://127.0.0.1:8200 -e BAO_TOKEN openbao bao "$@"
          }

          # `up --wait` returns once the container is running (the service has
          # no healthcheck), which is before the listener accepts. `bao status`
          # exits 2 for "reachable and sealed" and 1 for "could not connect".
          rc=1
          for _ in $(seq 1 30); do
            bao status >/dev/null 2>&1 && rc=0 || rc=$?
            if [ "$rc" -eq 2 ]; then break; fi
            sleep 1
          done
          if [ "$rc" -ne 2 ]; then
            echo "::error::OpenBao was not reachable and sealed within 30s (bao status exited $rc)"
            docker compose logs openbao
            exit 1
          fi

          init=$(bao operator init -format=json)
          jq -r '(.unseal_keys_b64[], .unseal_keys_hex[]?, .root_token) | "::add-mask::\(.)"' <<<"$init"

          for key in $(jq -r '.unseal_keys_b64[]' <<<"$init"); do
            bao operator unseal "$key" >/dev/null
            if bao status >/dev/null; then break; fi
          done
          bao status

          BAO_TOKEN=$(jq -er '.root_token' <<<"$init")
          export BAO_TOKEN
          bao secrets enable transit
          bao write -f transit/keys/demeteo-hub

          bao policy write demeteo-hub - <<'EOF'
          path "transit/encrypt/demeteo-hub"          { capabilities = ["update"] }
          path "transit/decrypt/demeteo-hub"          { capabilities = ["update"] }
          path "transit/datakey/plaintext/demeteo-hub" { capabilities = ["update"] }
          EOF

          hub_token=$(bao token create -policy=demeteo-hub -period=720h -format=json | jq -er '.auth.client_token')
          echo "::add-mask::$hub_token"
          echo "OPENBAO_TOKEN=$hub_token" >> "$GITHUB_ENV"

      - name: Hub protocol tests
        run: cargo test -p demeteo-hub-protocol

      # OPENBAO_TOKEN arrives through GITHUB_ENV from the step above, and is
      # the least-privilege token rather than root on purpose: the run then
      # proves the README's three-path policy is all the adapter needs.
      - name: Hub tests, including the Postgres- and OpenBao-backed ones
        env:
          DEMETEO_HUB_TEST_DATABASE_URL: postgres://demeteo:${{ env.POSTGRES_PASSWORD }}@127.0.0.1:5432/demeteo_hub
          OPENBAO_ADDR: http://127.0.0.1:8200
          DEMETEO_HUB_TRANSIT_KEY: demeteo-hub
        run: cargo test -p demeteo-hub -- --include-ignored

      - name: Build the Hub image (not pushed)
        working-directory: deploy/hub
        run: docker compose build hub

      - name: Service logs
        if: failure()
        working-directory: deploy/hub
        run: docker compose logs postgres openbao
