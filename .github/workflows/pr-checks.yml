name: PR Checks

# Also runs on master pushes, for two reasons neither of which is "test master
# twice". (1) A squash merge lands a commit no PR run ever saw — build.yml only
# bundles it, so a merge onto a moved master could ship broken and stay that way
# until the next PR opened. (2) Actions cache scoping: a PR run can read only
# its own ref's caches and the base branch's, never a sibling PR's. The Rust
# caches below are saved on master only, so every PR starts warm from the last
# master run instead of cold in every job (~5 min per PR run, and ~3.6 GB of
# cache per PR that used to push the repo into eviction at the 10 GB cap).
on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [master]

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  # Which of the jobs below this change can affect. The rule, its exceptions
  # and the evidence for them are in scripts/ci-changes.sh; this job only feeds
  # it the file list. A push to master skips the question and runs everything:
  # that run is what tests the squash commit and saves the caches every PR
  # starts from, and it is the backstop for anything the rule skipped on the PR.
  #
  # The list comes from the API rather than `git diff` so the checkout can stay
  # shallow. The endpoint stops at 3000 files, so a PR that large runs
  # everything instead of being judged on a truncated list.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      frontend: ${{ steps.decide.outputs.frontend }}
      rust: ${{ steps.decide.outputs.rust }}
      os_tests: ${{ steps.decide.outputs.os_tests }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Self-test the rule
        run: scripts/ci-changes.sh --self-test

      - name: Decide which jobs run
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ] || [ "$PR_CHANGED_FILES" -ge 3000 ]; then
            scripts/ci-changes.sh --all | tee -a "$GITHUB_OUTPUT"
          else
            gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" \
              --jq '.[] | [.status, .filename, (.previous_filename // "")] | @tsv' \
              > "$RUNNER_TEMP/changed.tsv"
            scripts/ci-changes.sh < "$RUNNER_TEMP/changed.tsv" | tee -a "$GITHUB_OUTPUT"
          fi

  # The build/test gate is a single shared script (scripts/checks.sh) that
  # developers and agents run locally before pushing, so "green locally" means
  # "green in CI" — no drift between an ad-hoc local run and these jobs. It is
  # split here by toolchain, not by gate: `frontend` needs no Rust and no
  # webkit packages, so a type error is reported in ~2 minutes rather than at
  # the end of a 14-minute step; `rust` carries fmt, clippy -D warnings (on the
  # pinned toolchain, rust-toolchain.toml), cargo doc, doc-refs and the demeteo
  # + core + runner tests. Commitlint lives in lint-commits.yml.
  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend checks (tsc, biome, class names, vitest)
        run: ./scripts/checks.sh frontend

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libdbus-1-dev \
            pkg-config

      # Installing `@stable` and letting rust-toolchain.toml override it at the
      # first cargo call downloads two toolchains. Reading the channel out of the
      # file installs exactly the one that will run, and keeps the bump in one
      # place (§7: local clippy must be CI clippy).
      - name: Resolve pinned toolchain
        id: toolchain
        shell: bash
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: clippy, rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> src-tauri/target"
          save-if: ${{ github.ref == 'refs/heads/master' }}
          cache-on-failure: true

      - name: Rust checks (fmt, clippy, doc, doc-refs, tests)
        run: ./scripts/checks.sh rust

  # The other two targets the desktop app ships on (build.yml's matrix). The
  # `rust` job runs on ubuntu only, so every `#[cfg(windows)]` item — and the
  # whole macOS half of every `cfg` — is unreachable from it, and the breakage
  # surfaces on master or a tag instead of on the PR. Compile coverage is the
  # point: clippy `--all-targets` type-checks the test targets too, so a
  # Windows-only test module that no ubuntu job can build fails here.
  # (AGENTS.md §3 "Cross-OS", docs/WINDOWS_PARITY.md "Gates")
  #
  # macos-14 is pinned to the image build.yml releases from, so a PR compiles
  # on the same SDK the shipped .app is built with.
  #
  # The tests are `cross-os-test` below, a separate job so that this one — the
  # half that runs on every Rust change — answers in a few minutes.
  cross-os:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-14]

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Resolve pinned toolchain
        id: toolchain
        shell: bash
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> src-tauri/target"
          save-if: ${{ github.ref == 'refs/heads/master' }}
          cache-on-failure: true

      - name: Install frontend dependencies
        run: npm ci

      - name: TypeScript type-check (tsc --noEmit)
        run: npx tsc --noEmit

      # demeteo-runner is excluded deliberately: it is remote-side code and the
      # remote is always Linux, and selecting it would unify its
      # `vendored-openssl` feature into demeteo-core, building OpenSSL from
      # source on both runners for a binary neither one ever produces.
      - name: Rust clippy (--all-targets -D warnings)
        run: cargo clippy --workspace --exclude demeteo-runner --all-targets -- -D warnings

  # The core tests on the other two targets — only when the change can behave
  # differently there (`os_tests`, scripts/ci-changes.sh), and always on master.
  #
  # Windows is sharded because the same suite that takes ~2 minutes on Linux
  # and macOS takes 12–17 there, which made this one leg the wall-clock of the
  # whole workflow. libtest cannot partition a test binary, so the Windows legs
  # run under cargo-nextest; `hash:` assigns each test to a shard by name, so a
  # new module lands in one without this file knowing it exists. macOS stays on
  # plain `cargo test`, the invocation scripts/checks.sh uses, so one leg here
  # still runs the suite the way a developer does.
  #
  # nextest does not run doctests; shard 1 runs them with cargo.
  #
  # Only shard 1 saves the Rust cache: the shards build the same artifacts
  # under the same key, and three concurrent saves of one key is two failures.
  cross-os-test:
    needs: changes
    if: needs.changes.outputs.rust == 'true' && needs.changes.outputs.os_tests == 'true'
    name: cross-os-test (${{ matrix.platform }}, ${{ matrix.shard }}/${{ matrix.shards }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: macos-14, shard: 1, shards: 1 }
          - { platform: windows-latest, shard: 1, shards: 3 }
          - { platform: windows-latest, shard: 2, shards: 3 }
          - { platform: windows-latest, shard: 3, shards: 3 }

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve pinned toolchain
        id: toolchain
        shell: bash
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> src-tauri/target"
          save-if: ${{ github.ref == 'refs/heads/master' && matrix.shard == 1 }}
          cache-on-failure: true

      - name: Core tests
        if: matrix.shards == 1
        run: cargo test -p demeteo-core

      - name: Install cargo-nextest
        if: matrix.shards > 1
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Core tests (shard ${{ matrix.shard }} of ${{ matrix.shards }})
        if: matrix.shards > 1
        run: cargo nextest run -p demeteo-core --no-fail-fast --partition hash:${{ matrix.shard }}/${{ matrix.shards }}

      - name: Core doctests
        if: matrix.shards > 1 && matrix.shard == 1
        run: cargo test -p demeteo-core --doc

  # The two parity gates, in one job because they share everything expensive:
  # the same loopback sshd image (each script builds it; the second build is a
  # layer-cache hit) and the same demeteo-core test build with the
  # `ssh-conformance` feature. As two jobs they compiled that build twice into
  # two ~470 MB caches. Separate from `rust` because they need Docker but none
  # of the Tauri/webkit toolchain.
  #
  # C2.2 — proves local/SSH parity by running the byte-identical `exec_contract`
  # against `SshClientAdapter` pointed at a throwaway loopback sshd.
  # C5 — topology-equivalence gate: one workflow run through local and
  # desktop-over-SSH must render an equivalent RunView (the runner leg lives in
  # the separate runner-conformance script because it additionally needs an
  # in-container git host). Uses the deterministic `stub` agent so a run reaches
  # a terminal state with no real LLM CLI. (docs/EXECUTION_PARITY.md)
  conformance:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Resolve pinned toolchain
        id: toolchain
        shell: bash
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> src-tauri/target"
          save-if: ${{ github.ref == 'refs/heads/master' }}
          cache-on-failure: true

      - name: Run ExecutionPort SSH conformance suite
        run: crates/demeteo-core/tests/conformance/run-ssh-conformance.sh

      - name: Run topology equivalence suite (local + SSH)
        run: crates/demeteo-core/tests/conformance/run-topology-conformance.sh

  # TEMPORARY — diagnosing one Windows test under nextest; removed before merge.
  nextest-diagnosis:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - id: toolchain
        shell: bash
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: A. cargo test, that test alone
        continue-on-error: true
        run: cargo test -p demeteo-core --lib a_grandchild_is_reaped
      - name: B. nextest, that test alone (captured)
        continue-on-error: true
        run: cargo nextest run -p demeteo-core -E 'test(a_grandchild_is_reaped)'
      - name: C. nextest, that test alone (no capture)
        continue-on-error: true
        run: cargo nextest run -p demeteo-core -E 'test(a_grandchild_is_reaped)' --no-capture
      - name: D. nextest, the local-execution module under load
        continue-on-error: true
        run: cargo nextest run -p demeteo-core -E 'test(/^adapters::local::/)' --no-fail-fast
      - name: E. bare Start-Process timing, output redirected
        continue-on-error: true
        shell: pwsh
        run: |
          $sw = [Diagnostics.Stopwatch]::StartNew()
          pwsh -NoProfile -NonInteractive -Command "Start-Process -FilePath 'pwsh' -NoNewWindow -ArgumentList '-NoProfile','-NonInteractive','-Command','New-Item -ItemType File -Path started.txt | Out-Null'; Start-Sleep 4" *> out.txt
          "elapsed: $($sw.Elapsed.TotalSeconds)s  started: $(Test-Path started.txt)"; Get-Content out.txt
