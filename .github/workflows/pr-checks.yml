name: PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [master]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libdbus-1-dev \
            pkg-config

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      # The build/test gate is a single shared script (scripts/checks.sh) that
      # developers and agents run locally before pushing, so "green locally"
      # means "green in CI" — no drift between an ad-hoc local run and this
      # job. It runs tsc, Biome, the Vitest frontend suite, fmt --check, clippy
      # -D warnings (on the pinned toolchain, rust-toolchain.toml), and the
      # demeteo + core + runner tests. Commitlint is skipped here because the
      # dedicated `wagoid` step below is the canonical PR-range gate.
      - name: PR checks (tsc, biome, vitest, fmt, clippy, tests)
        env:
          CHECKS_SKIP_COMMITLINT: "1"
        run: ./scripts/checks.sh

      - name: Lint commits
        uses: wagoid/commitlint-github-action@v6
        with:
          configFile: .commitlintrc.json
          failOnWarnings: false

  # The other two targets the desktop app ships on (build.yml's matrix). The
  # `verify` job runs on ubuntu only, so every `#[cfg(windows)]` item — and the
  # whole macOS half of every `cfg` — is unreachable from it, and the breakage
  # surfaces on master or a tag instead of on the PR. Compile coverage is the
  # point: clippy `--all-targets` type-checks the test targets too, so a
  # Windows-only test module that no ubuntu job can build fails here.
  # (AGENTS.md §3 "Cross-OS", docs/WINDOWS_PARITY.md "Gates")
  cross-os:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest]

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      # The other jobs reach the pinned toolchain indirectly — they install
      # `@stable`, and rust-toolchain.toml then overrides it at every cargo
      # invocation. Installing the pinned channel directly means the toolchain
      # rustup resolves is the one that was downloaded, and reading the channel
      # out of the file keeps the bump in exactly one place (§7: local clippy
      # must be CI clippy).
      - name: Resolve pinned toolchain
        id: toolchain
        shell: bash
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: TypeScript type-check (tsc --noEmit)
        run: npx tsc --noEmit

      # demeteo-runner is excluded deliberately: it is remote-side code and the
      # remote is always Linux, and selecting it would unify its
      # `vendored-openssl` feature into demeteo-core, building OpenSSL from
      # source on both runners for a binary neither one ever produces.
      - name: Rust clippy (--all-targets -D warnings)
        run: cargo clippy --workspace --exclude demeteo-runner --all-targets -- -D warnings

      - name: Core tests
        run: cargo test -p demeteo-core

  # C2.2 — proves local/SSH parity by running the byte-identical
  # `exec_contract` against `SshClientAdapter` pointed at a throwaway
  # loopback sshd. Separate job: it needs Docker but none of the Tauri/
  # webkit toolchain the `verify` job installs.
  # (docs/EXECUTION_PARITY.md)
  ssh-conformance:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Run ExecutionPort SSH conformance suite
        run: crates/demeteo-core/tests/conformance/run-ssh-conformance.sh

  # C5 — topology-equivalence gate: one workflow run through local and
  # desktop-over-SSH must render an equivalent RunView (the runner leg lives in
  # the separate runner-conformance job because it additionally needs an
  # in-container git host). Uses the deterministic `stub` agent so a run
  # reaches a terminal state with no real LLM CLI. Separate job for the same
  # reason as ssh-conformance: it needs Docker, not the Tauri toolchain.
  # (docs/EXECUTION_PARITY.md)
  topology-conformance:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Run topology equivalence suite (local + SSH)
        run: crates/demeteo-core/tests/conformance/run-topology-conformance.sh
