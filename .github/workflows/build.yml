name: Build & Release

on:
  push:
    branches: [master]
    tags: ["v*.*.*"]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ════════════════════════════════════════════════════════════════════
  # version — the one place the shipped version string is decided.
  #   master push  → <base>-N, base from package.json, N = 1 + commits
  #                  since the commit that set that base. Derived, never
  #                  stored: the previous design pushed a counter commit
  #                  back to master, which needed a PAT, doubled master's
  #                  history and raced whenever two pushes landed minutes
  #                  apart. Anchored on the version-bump commit rather
  #                  than on the v* tag because promote.yml pushes the
  #                  commit before the tag, so the master run it triggers
  #                  may not see the tag yet and would count from the
  #                  previous release.
  #   tag push     → the manifest version, which must equal the tag.
  # ════════════════════════════════════════════════════════════════════
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      base: ${{ steps.derive.outputs.base }}
      next_version: ${{ steps.derive.outputs.next_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Tags and history are the input to the rc number.
          fetch-depth: 0

      - name: Derive version
        id: derive
        shell: bash
        run: |
          base=$(node -p "require('./package.json').version")
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            next="${GITHUB_REF_NAME#v}"
            if [ "$next" != "$base" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match package.json version $base"
              exit 1
            fi
          else
            anchor=$(git log -1 --format=%H -S"\"version\": \"$base\"" -- package.json)
            if [ -n "$anchor" ]; then
              n=$(( $(git rev-list --count "$anchor..HEAD") + 1 ))
            else
              n=$(git rev-list --count HEAD)
            fi
            next="$base-$n"
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "next_version=$next" >> "$GITHUB_OUTPUT"
          echo "::notice::Version: $next"

  # ════════════════════════════════════════════════════════════════════
  # Build — single matrix for both triggers.
  #   master push  → embeds <base>-N via -c override.
  #   tag push     → uses the manifest version (clean stable).
  # Artifact name differs so nightly & stable don't collide on retries.
  # No `if:` here on purpose: `always()`/`!cancelled()` would exempt the
  # three expensive legs from the concurrency cancel above.
  # ════════════════════════════════════════════════════════════════════
  build:
    needs: version
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
            label: linux-x86_64
          - platform: macos-14
            rust_target: aarch64-apple-darwin
            label: macos-aarch64
          - platform: windows-latest
            rust_target: x86_64-pc-windows-msvc
            label: windows-x86_64

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # ── Linux system dependencies ──────────────────────────────────
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libdbus-1-dev \
            pkg-config \
            rpm

      # ── Node.js ────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      # ── Rust ───────────────────────────────────────────────────────
      # Install the pinned channel directly rather than `@stable`, which
      # rust-toolchain.toml then overrides at the first cargo call — that
      # downloaded two toolchains per job. (pr-checks.yml, cross-os)
      - name: Resolve pinned toolchain
        id: toolchain
        shell: bash
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          targets: ${{ matrix.rust_target }}

      # demeteo-runner ships as a static musl binary so it runs on any
      # remote Linux box regardless of glibc version — built once, on
      # the Linux leg, independent of the per-platform app target above.
      # cmake is named explicitly because aws-lc-sys builds its C sources with
      # it, and reqwest's `rustls` feature pulls aws-lc-rs. The GitHub runner
      # image happens to preinstall cmake, so omitting it works right up until
      # the image drops it — and the failure would land on a release tag, not
      # on a PR, since this job only runs on master and tags.
      - name: Install musl target for demeteo-runner
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          rustup target add x86_64-unknown-linux-musl
          sudo apt-get install -y musl-tools cmake

      # Cargo.lock lives at the repo root and .cargo/config.toml pins the
      # target dir under src-tauri; both halves have to be named or the key
      # never rotates on a lockfile change.
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> src-tauri/target"
          key: ${{ matrix.rust_target }}

      # ── Version override (master pushes only) ──────────────────────
      # Tauri is built with a runtime config override (-c) that injects
      # the rc version into bundle metadata, without mutating source.
      # On tag pushes this step is skipped — bundles use manifest version.
      - name: Write runtime version override
        if: github.ref == 'refs/heads/master'
        shell: bash
        run: |
          mkdir -p .release
          printf '{\n  "version": "%s"\n}\n' "${{ needs.version.outputs.next_version }}" \
            > .release/tauri-version-override.json
          cat .release/tauri-version-override.json

      # Retried because every build.yml failure in the last 99 runs was a
      # Tauri bundler flake (bundle_dmg.sh ×3, linuxdeploy download ×1) and
      # none was a compile error; cargo is incremental, so a second attempt
      # re-runs only the bundling. --verbose keeps the bundler's stderr,
      # which the default log drops.
      - name: Build Tauri app
        shell: bash
        env:
          TAURI_CONFIG_OVERRIDE: ${{ github.ref == 'refs/heads/master' && '.release/tauri-version-override.json' || '' }}
        run: |
          args=(--verbose --target "${{ matrix.rust_target }}")
          if [ -n "$TAURI_CONFIG_OVERRIDE" ]; then
            args+=(-c "$TAURI_CONFIG_OVERRIDE")
          fi
          for attempt in 1 2 3; do
            if npx tauri build "${args[@]}"; then
              exit 0
            fi
            echo "::warning::tauri build attempt $attempt failed"
            if [ "$attempt" -lt 3 ]; then
              sleep 20
            fi
          done
          exit 1

      # ── demeteo-runner (Linux leg only) ─────────────────────────────
      # Built with the exact same version string as the app it ships
      # alongside (nightly: <base>-N, stable: vX.Y.Z tag minus the `v`)
      # so `demeteo-runner --version` can be string-compared directly
      # against `app.package_info().version` when the laptop decides
      # whether a locally cached runner build is up to date.
      - name: Build demeteo-runner
        if: matrix.platform == 'ubuntu-22.04'
        env:
          DEMETEO_RUNNER_VERSION: ${{ needs.version.outputs.next_version }}
        run: |
          cargo build --release -p demeteo-runner --target x86_64-unknown-linux-musl

      - name: Package demeteo-runner asset
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          mkdir -p release-files/runner
          cp src-tauri/target/x86_64-unknown-linux-musl/release/demeteo-runner \
            release-files/runner/demeteo-runner-x86_64-unknown-linux-musl
          ( cd release-files/runner && sha256sum demeteo-runner-x86_64-unknown-linux-musl \
            > demeteo-runner-x86_64-unknown-linux-musl.sha256 )
          ls -lh release-files/runner/

      # ── Upload artifacts ───────────────────────────────────────────
      # Artifact prefix matches trigger so nightly/stable never collide.
      - name: Upload artifacts (Linux, nightly)
        if: matrix.platform == 'ubuntu-22.04' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v6
        with:
          name: binaries-${{ matrix.label }}
          path: |
            src-tauri/target/${{ matrix.rust_target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.rust_target }}/release/bundle/rpm/*.rpm
            src-tauri/target/${{ matrix.rust_target }}/release/bundle/appimage/*.AppImage
            release-files/runner/*
          if-no-files-found: error
          retention-days: 5

      - name: Upload artifacts (Linux, stable)
        if: matrix.platform == 'ubuntu-22.04' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v6
        with:
          name: stable-${{ matrix.label }}
          path: |
            src-tauri/target/${{ matrix.rust_target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.rust_target }}/release/bundle/rpm/*.rpm
            src-tauri/target/${{ matrix.rust_target }}/release/bundle/appimage/*.AppImage
            release-files/runner/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload artifacts (macOS, nightly)
        if: startsWith(matrix.platform, 'macos') && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v6
        with:
          name: binaries-${{ matrix.label }}
          path: |
            src-tauri/target/${{ matrix.rust_target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 5

      - name: Upload artifacts (macOS, stable)
        if: startsWith(matrix.platform, 'macos') && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v6
        with:
          name: stable-${{ matrix.label }}
          path: |
            src-tauri/target/${{ matrix.rust_target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14

      - name: Upload artifacts (Windows, nightly)
        if: matrix.platform == 'windows-latest' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v6
        with:
          name: binaries-${{ matrix.label }}
          path: |
            src-tauri/target/${{ matrix.rust_target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.rust_target }}/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 5

      - name: Upload artifacts (Windows, stable)
        if: matrix.platform == 'windows-latest' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v6
        with:
          name: stable-${{ matrix.label }}
          path: |
            src-tauri/target/${{ matrix.rust_target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.rust_target }}/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

  # ════════════════════════════════════════════════════════════════════
  # nightly-release — fires on master pushes after every build leg passed.
  # Tag = <base>-N (does NOT match v*.*.*, so it never retriggers).
  # ════════════════════════════════════════════════════════════════════
  nightly-release:
    needs: [build, version]
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download nightly artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          pattern: binaries-*

      - name: Collect release files
        run: |
          mkdir -p release-files
          find artifacts -type f \
            \( -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" \
               -o -name "*.dmg" -o -name "*.msi" -o -name "*.exe" \
               -o -name "demeteo-runner-*" \) \
            -exec cp {} release-files/ \;
          echo "── Release files ──"
          ls -lh release-files/

      # ── Build changelog from commits since the previous rc tag ──────
      - name: Build changelog
        id: changelog
        run: |
          VERSION="${{ needs.version.outputs.next_version }}"
          BASE="${{ needs.version.outputs.base }}"
          PREV=$(git tag --list "${BASE}-*" --sort=-version:refname | sed -n '1p')
          if [ -z "$PREV" ]; then
            PREV=$(git tag --list 'v*.*.*' --sort=-version:refname | sed -n '1p')
          fi
          if [ -z "$PREV" ]; then
            PREV=$(git rev-list --max-parents=0 HEAD)
          fi
          echo "previous=$PREV"
          {
            echo "## Commits since \`$PREV\`"
            echo ""
            git log "${PREV}..HEAD" --no-merges --pretty=format:'- `%h` %s'
          } > release-notes.md
          cat release-notes.md

      - name: Publish nightly rc release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.next_version }}
          name: "Nightly ${{ needs.version.outputs.next_version }}"
          body: |
            > ⚠️ **Automated pre-release** — not recommended for production use.

            **Version:** `${{ needs.version.outputs.next_version }}`
            **Commit:** [`${{ github.sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})
            **Date:** ${{ github.event.head_commit.timestamp }}

            Each push to `master` produces a new `-rc` release.
            Stable releases are cut with the **Promote Release** workflow.

            ---

            **macOS:** if you see *"demeteo.app is damaged and can't be opened"*, the app
            just isn't notarized by Apple. It's not actually damaged. After dragging it to
            Applications, clear the quarantine flag once:

            ```bash
            xattr -cr /Applications/demeteo.app
            ```

            Then open it normally. (Right-click → Open does **not** work for this case.)

            ---

            ${{ steps.changelog.outputs.content }}
          prerelease: true
          make_latest: false
          files: release-files/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ════════════════════════════════════════════════════════════════════
  # stable-release — fires on tag pushes (vX.Y.Z from promote workflow).
  # Requires every build leg: v1.2.0 once shipped as "latest" with no
  # macOS asset because this job ran under `always()`.
  # ════════════════════════════════════════════════════════════════════
  stable-release:
    needs: build
    if: needs.build.result == 'success' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download stable artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          pattern: stable-*

      - name: Collect release files
        run: |
          mkdir -p release-files
          find artifacts -type f \
            \( -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" \
               -o -name "*.dmg" -o -name "*.msi" -o -name "*.exe" \
               -o -name "demeteo-runner-*" \) \
            -exec cp {} release-files/ \;
          echo "── Release files ──"
          ls -lh release-files/

      # ── Generate Arch Linux PKGBUILD ───────────────────────────────
      - name: Generate PKGBUILD
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          APPIMAGE_FILE=$(ls release-files/*.AppImage | head -1)
          APPIMAGE_NAME=$(basename "$APPIMAGE_FILE")
          APPIMAGE_SHA256=$(sha256sum "$APPIMAGE_FILE" | cut -d' ' -f1)

          cat > release-files/PKGBUILD << 'PKGBUILD_EOF'
          # Maintainer: Steven Yepes <stevenyepes@users.noreply.github.com>
          pkgname=demeteo-bin
          pkgver=PLACEHOLDER_VERSION
          pkgrel=1
          pkgdesc="Fleet-style multi-agent orchestrator for software development"
          arch=('x86_64')
          url="https://github.com/stevenyepes/demeteo"
          license=('MIT')
          depends=('webkit2gtk-4.1' 'openssl' 'dbus' 'hicolor-icon-theme')
          provides=('demeteo')
          conflicts=('demeteo')
          options=('!strip')
          source=("https://github.com/stevenyepes/demeteo/releases/download/v${pkgver}/PLACEHOLDER_APPIMAGE")
          sha256sums=('PLACEHOLDER_SHA256')

          package() {
              install -Dm755 "${srcdir}/PLACEHOLDER_APPIMAGE" "${pkgdir}/opt/demeteo/demeteo.AppImage"

              # Create launcher script
              install -dm755 "${pkgdir}/usr/bin"
              cat > "${pkgdir}/usr/bin/demeteo" << 'EOF'
          #!/bin/sh
          exec /opt/demeteo/demeteo.AppImage "$@"
          EOF
              chmod +x "${pkgdir}/usr/bin/demeteo"

              # Desktop entry
              install -Dm644 /dev/stdin "${pkgdir}/usr/share/applications/demeteo.desktop" << 'EOF'
          [Desktop Entry]
          Name=Demeteo
          Comment=Fleet-style multi-agent orchestrator
          Exec=demeteo
          Icon=demeteo
          Type=Application
          Categories=Development;
          EOF
          }
          PKGBUILD_EOF

          sed -i "s/PLACEHOLDER_VERSION/$VERSION/g" release-files/PKGBUILD
          sed -i "s/PLACEHOLDER_APPIMAGE/$APPIMAGE_NAME/g" release-files/PKGBUILD
          sed -i "s/PLACEHOLDER_SHA256/$APPIMAGE_SHA256/g" release-files/PKGBUILD
          sed -i 's/^          //' release-files/PKGBUILD

          echo "── PKGBUILD ──"
          cat release-files/PKGBUILD

      - name: Publish stable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Demeteo ${{ github.ref_name }}"
          body: |
            **macOS:** if you see *"demeteo.app is damaged and can't be opened"*, the app
            just isn't notarized by Apple. It's not actually damaged. After dragging it to
            Applications, clear the quarantine flag once:

            ```bash
            xattr -cr /Applications/demeteo.app
            ```

            Then open it normally. (Right-click → Open does **not** work for this case.)
          generate_release_notes: true
          prerelease: false
          make_latest: true
          files: release-files/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
